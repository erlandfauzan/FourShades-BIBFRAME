name: Heavenly Principles Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  shacl-and-contract-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Naberius MARCXML-to-BIBFRAME ETL
        run: python -m src.naberius_etl.converter

      - name: Run Pytest (SHACL Validation, Lineage & API Contract)
        run: pytest -v

      - name: Upload Generated BIBFRAME Graph Artifact
        uses: actions/upload-artifact@v4
        with:
          name: world-literature-bibframe-ttl
          path: data/output/world_literature_bibframe.ttl